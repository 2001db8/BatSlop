<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a1b;
      background: #ffffff;
    }
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img { width: 36px; height: 36px; border-radius: 6px; }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header p { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 1px solid #edeff1;
      background: #f8f9fa;
    }
    .toggle-row label { font-weight: 600; font-size: 13px; }
    .switch {
      position: relative;
      width: 40px;
      height: 22px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ccc; border-radius: 22px;
      transition: 0.2s;
    }
    .slider:before {
      content: "";
      position: absolute;
      height: 16px; width: 16px;
      left: 3px; bottom: 3px;
      background: white; border-radius: 50%;
      transition: 0.2s;
    }
    .switch input:checked + .slider { background: #0079d3; }
    .switch input:checked + .slider:before { transform: translateX(18px); }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #edeff1;
    }
    .section-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #7c7c7c;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    .tag-list {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 11px;
      color: #333;
    }
    .tag .remove {
      cursor: pointer;
      color: #999;
      font-size: 14px;
      line-height: 1;
    }
    .tag .remove:hover { color: #ff4500; }

    .add-row {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .add-row input {
      flex: 1;
      padding: 5px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .add-row input:focus { border-color: #0079d3; }
    .add-row button {
      padding: 5px 12px;
      background: #0079d3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .add-row button:hover { background: #0060a8; }

    .replacement-list {
      max-height: 180px;
      overflow-y: auto;
    }
    .replacement-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 0;
      font-size: 11px;
    }
    .replacement-item .from { color: #ff4500; text-decoration: line-through; }
    .replacement-item .arrow { color: #999; }
    .replacement-item .to { color: #0079d3; font-weight: 600; }
    .replacement-item .remove {
      cursor: pointer;
      color: #ccc;
      margin-left: auto;
      font-size: 14px;
    }
    .replacement-item .remove:hover { color: #ff4500; }

    .add-replacement {
      display: flex;
      gap: 4px;
      margin-top: 8px;
      align-items: center;
    }
    .add-replacement input {
      flex: 1;
      padding: 5px 6px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 11px;
      outline: none;
    }
    .add-replacement input:focus { border-color: #0079d3; }
    .add-replacement .arrow-label { color: #999; font-size: 12px; }
    .add-replacement button {
      padding: 5px 10px;
      background: #0079d3;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .footer {
      padding: 8px 16px;
      text-align: center;
      color: #999;
      font-size: 10px;
    }

    .reset-btn {
      display: block;
      margin: 0 auto;
      padding: 5px 16px;
      background: none;
      border: 1px solid #ddd;
      border-radius: 4px;
      color: #999;
      font-size: 11px;
      cursor: pointer;
      margin-bottom: 6px;
    }
    .reset-btn:hover { border-color: #ff4500; color: #ff4500; }
  </style>
</head>
<body>
  <div class="header">
    <img src="assets/batslopslap.png" alt="BatSlop">
    <div>
      <h1>BatSlop</h1>
      <p>"I made..." &rarr; "AI made..."</p>
    </div>
  </div>

  <div class="toggle-row">
    <label>Extension Enabled</label>
    <div class="switch">
      <input type="checkbox" id="enabled" checked>
      <span class="slider"></span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Target Subreddits</div>
    <div class="tag-list" id="subreddit-list"></div>
    <div class="add-row">
      <input type="text" id="new-sub" placeholder="e.g. programming">
      <button id="add-sub">Add</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Text Replacements</div>
    <div class="replacement-list" id="replacement-list"></div>
    <div class="add-replacement">
      <input type="text" id="new-from" placeholder="I made">
      <span class="arrow-label">&rarr;</span>
      <input type="text" id="new-to" placeholder="AI made">
      <button id="add-replacement">+</button>
    </div>
  </div>

  <div class="footer">
    <button class="reset-btn" id="reset">Reset to Defaults</button>
    BatSlop v1.0 &mdash; Not all heroes wear capes
  </div>

  <script src="scripts/defaults.js"></script>
  <script src="scripts/popup.js"></script>
</body>
</html>
